<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiếng Anh lớp 12 – Global Success</title>
<style>
:root{--ink:#16313b;--mut:#5f7a84;--bg:#fdf1ef;--teal:#c0392b;--sun:#ffc83d;--coral:#ff6a5b;--sky:#dff1fb;--line:#f2d8d3}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Baloo 2","Trebuchet MS",ui-rounded,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:2.5rem}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #1b6ef3;outline-offset:2px}
header{background:var(--teal);color:#fff;padding:1.375rem 1rem 3.625rem;text-align:center}
header h1{margin:0;font-size:1.75rem}
header p{margin:0.25rem 0 0;opacity:.9}
#stat{display:inline-block;margin-top:0.625rem;background:rgba(255,255,255,.22);padding:0.25rem 0.875rem;border-radius:6.1875rem;font-weight:700;font-size:0.875rem}
main{max-width:35rem;margin:.75rem auto 0;padding:0 0.875rem}

#utitle{font-weight:800;font-size:1.125rem;margin:0 0.25rem 0.625rem}
#utitle small{display:block;color:var(--mut);font-weight:600;font-size:0.875rem}
#tabs{display:flex;background:#fff;border-radius:0.875rem;padding:0.25rem;gap:0.25rem;border:2px solid var(--line)}
#tabs button{flex:1;border:0;background:none;padding:0.5625rem 2px;border-radius:0.625rem;font-weight:700;font-size:0.875rem;color:var(--mut);cursor:pointer}
#tabs button.on{background:var(--teal);color:#fff}
.card{background:#fff;border-radius:1.5rem;padding:1.25rem 1.125rem 1.125rem;margin-top:0.75rem;text-align:center;border:2px solid var(--line);box-shadow:0 0.375rem 0 var(--line)}
.bar{height:0.5rem;background:var(--line);border-radius:0.5625rem;overflow:hidden}
#fill{display:block;height:100%;width:0;background:var(--coral);transition:width .3s}
#emoji{font-size:5.75rem;line-height:1.2;margin-top:0.75rem}
#tag{display:inline-block;padding:3px 0.75rem;border-radius:6.1875rem;font-size:0.8125rem;font-weight:800}
.t1{background:#fadbd6;color:#8a1f14}.t2{background:#fff0c2;color:#7a5600}.t3{background:var(--sky);color:#1f5f86}
#w{font-size:2.5rem;margin:0.5rem 0 2px;line-height:1.15;word-break:break-word}
#ipa{font:1.375rem "Times New Roman",serif;color:var(--coral);min-height:1.75rem}
#vn{font-size:1.3125rem;color:var(--mut);margin:0.25rem 0 0.625rem;font-weight:700}
#res{min-height:1.5rem;font-weight:800;margin:0.375rem 0}
.ok{color:#118a4e}.no{color:#c0392b}
.row{display:flex;gap:0.5rem;margin-top:0.5rem}
.row button,.big{flex:1;padding:0.8125rem 0.375rem;border:0;border-radius:0.875rem;font-weight:800;font-size:1rem;color:#fff;cursor:pointer;box-shadow:0 0.25rem 0 rgba(0,0,0,.18)}
.row button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.b1{background:#27ae60}.b2{background:#2d7fd3}.b3{background:#7c4dbb}.b4{background:#8a9aa0}
#know.done{background:var(--sun);color:#5a4200}
#cnt{color:var(--mut);font-size:0.875rem;margin:0.75rem 0 0}
.pop{animation:pop .22s}
@keyframes pop{from{transform:scale(.97)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}#fill{transition:none}}
#tg{width:100%;margin-top:1rem;background:var(--ink);padding:0.75rem}
#teach{display:none;background:#fff8dc;border:2px solid #f3dd8b;border-radius:1.125rem;padding:1rem;margin-top:0.625rem}
#teach h3{margin:0 0 0.625rem;text-align:center}
input{width:100%;padding:0.625rem;font-size:0.9375rem;border:2px solid var(--line);border-radius:0.625rem;margin-bottom:0.5rem}
.add{background:#e67e22;width:100%}
#msg{color:#118a4e;font-weight:700;text-align:center;margin:0.5rem 0 0;min-height:1.25rem}
#note{text-align:center;color:#b05a12;font-weight:700;font-size:0.875rem;margin-top:0.875rem}
#lock{display:none;position:fixed;inset:0;background:rgba(10,30,36,.6);justify-content:center;align-items:flex-start;padding:3.75rem 1.125rem;z-index:9}
.lc{background:#fff;border-radius:1.375rem;padding:1.625rem;max-width:26.25rem;width:100%;text-align:center;border-top:0.375rem solid var(--coral)}
.lc h2{margin:0 0 0.5rem}
#err{color:#c0392b;font-weight:700;min-height:1.25rem}

html{-webkit-text-size-adjust:100%;font-size:calc(clamp(15px,min(.8vw + 13px,2.2vh + 8px),30px)*var(--z,1))}
#zoom{display:inline-flex;align-items:center;gap:.25rem;background:rgba(255,255,255,.22);border-radius:6rem;padding:.2rem;margin-bottom:.6rem}
#zoom button{border:0;border-radius:6rem;min-width:2.75rem;height:2.5rem;background:#fff;color:var(--teal);font-weight:800;font-size:1rem;cursor:pointer}
#zoom #zv{background:none;color:#fff;min-width:3.6rem}
#tabs{flex-wrap:wrap}
main{max-width:64rem}
#app{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:1rem;align-items:start}
#pane{max-width:40rem;width:100%;margin:0 auto}
#units{background:#fff;border:2px solid var(--line);border-radius:1.25rem;padding:.5rem;display:flex;flex-direction:column;gap:.35rem;position:sticky;top:.75rem;max-height:calc(100vh - 1.5rem);overflow-y:auto}
#units::before{content:"📚 Danh sách bài học";font-weight:800;color:var(--mut);padding:.4rem .6rem;font-size:.9rem}
#units button{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;padding:.5rem .6rem;border:2px solid transparent;border-radius:.9rem;background:#fff;color:var(--ink);cursor:pointer;position:relative}
#units button:hover{background:var(--bg)}
#units button.on{background:var(--sun);border-color:var(--sun)}
#units b{flex:none;width:2rem;height:2rem;border-radius:.6rem;background:var(--bg);display:grid;place-items:center}
#units .on b{background:#fff}
#units span{flex:1;min-width:0;line-height:1.25}
#units strong{display:block;font-size:.95rem}
#units small{color:var(--mut);font-weight:700;font-size:.8rem}
#units .on small{color:#5a4200}
#units i{font-style:normal;font-size:1.3rem}
#units .lk::after{content:"🔒";font-size:.8rem}
.nw main{max-width:36rem}
.nw #app{display:block}
.nw #units{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding:.45rem;margin-bottom:.6rem}
.nw #units::before{display:none}
.nw #units button{flex:none;width:auto;padding:.3rem}
.nw #units span,.nw #units i{display:none}
.nw #units b{width:2.4rem;height:2.4rem}
.nw #units .lk::after{position:absolute;right:-.25rem;top:-.4rem}
#tabs button{flex:1 1 auto}

header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.3rem .6rem;padding:.4rem .9rem}
header h1{font-size:1.1rem;flex:1;text-align:left;white-space:nowrap}
#stat{margin:0;padding:.15rem .7rem;font-size:.8rem}
#zoom{margin:0;padding:.15rem;gap:.15rem}
#zoom button{min-width:2.4rem;height:2.1rem;font-size:.9rem}
#zoom #zv{min-width:2.9rem}

#mode{display:flex;gap:.25rem;margin-bottom:.5rem;background:#fff;border:2px solid var(--line);border-radius:.875rem;padding:.25rem}
#mode button{flex:1;border:0;background:none;padding:.55rem;border-radius:.625rem;font-weight:800;color:var(--mut);cursor:pointer;font-size:.95rem}
#mode button.on{background:var(--ink);color:#fff}
#pcard{text-align:left}
#pcard h3{margin:.2rem 0 .5rem;text-align:center}
.pbf{display:block;height:100%;background:var(--coral);transition:width .3s}
.lvb{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;padding:.7rem;margin-top:.5rem;border:2px solid var(--line);border-radius:1rem;background:#fff;color:var(--ink);cursor:pointer;font-size:.95rem}
.lvb:hover{border-color:var(--coral);background:var(--bg)}
.lvb i{font-style:normal;font-size:1.7rem}
.lvb span{flex:1;min-width:0}
.lvb small{display:block;color:var(--mut);font-weight:600}
.lvb em{font-style:normal;font-weight:800;color:#118a4e;white-space:nowrap}
.qi{color:var(--mut);font-weight:800;font-size:.85rem;margin:.6rem 0 .2rem}
.qp{font-size:1.35rem;font-weight:800;text-align:center;margin:.5rem 0 .8rem;line-height:1.4;word-break:break-word}
.qp small{display:block;font-size:.95rem;color:var(--mut);font-weight:700;margin-top:.3rem}
.op{display:block;width:100%;text-align:left;margin-top:.45rem;padding:.7rem .8rem;border:2px solid var(--line);border-radius:.9rem;background:#fff;color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer}
.op:hover{border-color:var(--coral)}
.op.ok{background:#d9f5e5;border-color:#27ae60}
.op.no{background:#fde0dc;border-color:#c0392b}
.az{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;min-height:3rem;padding:.5rem;border-radius:.9rem}
#paz{border:2px dashed var(--line);margin-bottom:.6rem}
.tk{border:2px solid var(--line);background:#fff;border-radius:.7rem;padding:.45rem .7rem;font-weight:800;font-size:1.05rem;color:var(--ink);cursor:pointer;box-shadow:0 .2rem 0 var(--line)}
.tk:disabled{opacity:.3;box-shadow:none}
#pcard.d .op,#pcard.d #paz .tk,#pcard.d #pbk .tk{pointer-events:none}
#pf{min-height:1.5rem;font-weight:800;margin:.6rem 0 0;text-align:center}
.pb{display:flex;gap:.5rem;margin-top:.6rem}
.wr{padding:.4rem .6rem;margin-top:.35rem;border-left:4px solid var(--coral);background:var(--bg);border-radius:.5rem;font-weight:700;font-size:.9rem}
#mode button{font-size:.85rem;padding:.55rem .15rem}
#xcard{text-align:left}#xcard h3{margin:.2rem 0 .5rem;text-align:center}
#xcard.d .op,#xcard.d .tk{pointer-events:none}
#mode{flex-wrap:wrap}#mode button{min-width:5.2rem}
.ps{background:var(--bg);border-radius:.8rem;padding:.6rem;margin:.4rem 0;font-weight:600;line-height:1.5;font-size:.95rem}
.rl{background:#fff8dc;border:2px solid #f3dd8b;border-radius:1rem;padding:.7rem;font-weight:700;font-size:.92rem;line-height:1.5;margin-bottom:.4rem}
.op.sel{background:var(--sky);border-color:#2d7fd3}.op:disabled{cursor:default}
#xcard .eg{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}#xcard .eg .op{text-align:center;font-size:2rem;padding:.4rem 0;margin-top:0}
#xcard .gp{line-height:2.4}#xcard .gp input{display:inline-block;width:8.5rem;margin:0 .15rem;padding:.2rem .4rem;font-size:1rem;text-align:center}
</style>
</head>
<body>
<header><h1>🌟 Tiếng Anh lớp 12</h1><div id="stat"></div><div id="zoom"><button id="zm" aria-label="Thu nhỏ chữ">A−</button><button id="zv" aria-label="Về cỡ mặc định">100%</button><button id="zp" aria-label="Phóng to chữ">A+</button></div></header>
<main><div id="app">
<nav id="units" aria-label="Danh sách bài học"></nav>
<div id="pane">
<div id="utitle"></div>
<div id="mode"><button data-m="0" class="on">🃏 Thẻ học</button><button data-m="1">✍️ Luyện tập</button><button data-m="2">📘 Ngữ pháp</button><button data-m="3">🎧 Luyện nghe</button><button data-m="4">📝 Kiểm tra</button></div>
<div id="tabs">
<button data-t="0" class="on">Tất cả</button><button data-t="1">Từ chính</button><button data-t="2">Mở rộng</button><button data-t="3">Mẫu câu</button>
</div>
<section class="card" id="card">
<div class="bar"><i id="fill"></i></div>
<div id="emoji"></div><span id="tag"></span>
<h2 id="w"></h2><div id="ipa"></div><div id="vn"></div>
<p id="res" aria-live="polite"></p>
<div class="row"><button class="b1" id="bl">🔊 Nghe</button><button class="b2" id="bs">🎙 Đọc</button></div>
<div class="row"><button class="b4" id="bp" aria-label="Từ trước">◀</button><button class="b3" id="know">⭐ Đã thuộc</button><button class="b4" id="bn" aria-label="Từ sau">▶</button></div>
<p id="cnt"></p>
</section>
<section class="card" id="pcard" style="display:none"></section>
<section class="card" id="xcard" style="display:none"></section>
<button class="big" id="tg">👨‍🏫 Chế độ giáo viên (thêm từ)</button>
<div id="teach">
<h3>Thêm từ vào Unit đang chọn</h3>
<input id="nw" placeholder="Từ tiếng Anh"><input id="ni" placeholder="Phiên âm IPA (không bắt buộc)"><input id="nm" placeholder="Nghĩa tiếng Việt">
<button class="big add" id="ba">➕ Lưu từ</button><p id="msg"></p>
</div>
<p id="note"></p>
</div></div>
</main>
<div id="lock"><div class="lc">
<h2>🔒 Unit đã khóa</h2>
<p style="color:#5f7a84">Unit 1 dùng thử miễn phí. Nhập mật khẩu để mở Unit 2 – 10.</p>
<input type="password" id="pw" placeholder="Nhập mật khẩu bản quyền...">
<button class="big b1" id="bk" style="width:100%;margin-bottom:.5rem">🔓 Mở khóa</button>
<button class="big b4" id="bx" style="width:100%">Để sau</button>
<p id="err"></p>
</div></div>
<script>
const FREE=1,PW="1228011981",$=id=>document.getElementById(id);
// Dữ liệu Tiếng Anh lớp 12 - Global Success (10 Units x 46 mục/unit)
const D=[
  ["Life stories we admire", "Những câu chuyện đời đáng ngưỡng mộ", "📖", "👏|admire|ədˈmaɪə|ngưỡng mộ;🏆|achievement|əˈtʃiːvmənt|thành tựu;📖|biography|baɪˈɒɡrəfi|tiểu sử;👶|childhood|ˈtʃaɪldhʊd|tuổi thơ;💖|dedicate|ˈdedɪkeɪt|cống hiến;🌟|distinguished|dɪˈstɪŋɡwɪʃt|xuất chúng;👤|figure|ˈfɪɡə|nhân vật;🎁|generosity|ˌdʒenəˈrɒsəti|sự hào phóng;🦸|hero|ˈhɪərəʊ|anh hùng;🙇|humble|ˈhʌmbl|khiêm tốn;💡|inspire|ɪnˈspaɪə|truyền cảm hứng;🇻🇳|patriot|ˈpætriət|người yêu nước;🤔|philosopher|fəˈlɒsəfə|nhà triết học;🧠|prodigy|ˈprɒdədʒi|thần đồng;🤝|respectable|rɪˈspektəbl|đáng kính;🩸|sacrifice|ˈsækrɪfaɪs|sự hy sinh;👁️|visionary|ˈvɪʒənri|người nhìn xa trông rộng;🙋|volunteer|ˌvɒlənˈtɪə|người tình nguyện;🧗|overcome|ˌəʊvəˈkʌm|vượt qua;🔥|devotion|dɪˈvəʊʃn|sự tận tâm", "📢|campaign|kæmˈpeɪn|chiến dịch;🤝|charity|ˈtʃærəti|tổ chức từ thiện;💰|contribution|ˌkɒntrɪˈbjuːʃn|sự đóng góp;💪|determination|dɪˌtɜːmɪˈneɪʃn|sự quyết tâm;📓|diary|ˈdaɪəri|nhật ký;🌱|foster|ˈfɒstə|nuôi dưỡng;🏥|hospitalise|ˈhɒspɪtəlaɪz|nhập viện;🆔|identity|aɪˈdentəti|danh tính;📥|insert|ɪnˈsɜːt|chèn vào;🐶|loyal|ˈlɔɪəl|trung thành;🧠|memory|ˈmeməri|trí nhớ, kỷ niệm;🪖|military|ˈmɪlətri|thuộc quân đội;🏠|orphanage|ˈɔːfənɪdʒ|trại trẻ mồ côi;🪦|pass away|pɑːs əˈweɪ|qua đời;🧗|perseverance|ˌpɜːsɪˈvɪərəns|sự kiên trì;🚀|pioneer|ˌpaɪəˈnɪə|người tiên phong;👑|rule|ruːl|cai trị;⚡|stimulate|ˈstɪmjuleɪt|kích thích;🎯|strategy|ˈstrætədʒi|chiến lược;🙋|willing|ˈwɪlɪŋ|sẵn lòng", "💬|He is a distinguished philosopher who dedicated his life to education.||Anh ấy là một nhà triết học xuất chúng, người đã cống hiến cả đời cho giáo dục.;💬|Her childhood was full of hardships, but she overcame them all.||Tuổi thơ của cô ấy đầy gian khổ, nhưng cô ấy đã vượt qua tất cả.;💬|The hero made a great sacrifice for his country's independence.||Vị anh hùng đã có một sự hy sinh to lớn cho nền độc lập của đất nước.;💬|We deeply admire his generosity and devotion to the community.||Chúng tôi vô cùng ngưỡng mộ sự hào phóng và tận tâm của anh ấy đối với cộng đồng.;💬|She inspired many young people to follow their dreams.||Cô ấy đã truyền cảm hứng cho nhiều bạn trẻ theo đuổi ước mơ của mình.;💬|As a prodigy, he showed remarkable talent at a very early age.||Là một thần đồng, cậu ấy đã thể hiện tài năng đáng chú ý ở độ tuổi rất nhỏ."],

  ["Green living", "Lối sống xanh", "🌿", "🌿|green|ɡriːn|xanh (thân thiện môi trường);🏡|living|ˈlɪvɪŋ|lối sống;👣|carbon footprint|ˌkɑːbən ˈfʊtprɪnt|dấu chân carbon;♻️|eco-friendly|ˌiːkəʊ ˈfrendli|thân thiện môi trường;🔋|energy|ˈenədʒi|năng lượng;🌍|environment|ɪnˈvaɪrənmənt|môi trường;🥬|organic|ɔːˈɡænɪk|hữu cơ;🏭|pollution|pəˈluːʃn|sự ô nhiễm;♻️|recycle|ˌriːˈsaɪkl|tái chế;📉|reduce|rɪˈdjuːs|giảm thiểu;☀️|renewable|rɪˈnjuːəbl|có thể tái tạo;🔄|reuse|ˌriːˈjuːz|tái sử dụng;☀️|solar|ˈsəʊlə|thuộc năng lượng mặt trời;🌱|sustainable|səˈsteɪnəbl|bền vững;🗑️|waste|weɪst|rác thải;🧠|aware|əˈweə|có nhận thức;🛡️|conservation|ˌkɒnsəˈveɪʃn|sự bảo tồn;🦋|ecosystem|ˈiːkəʊsɪstəm|hệ sinh thái;🛡️|protect|prəˈtekt|bảo vệ;📚|resource|rɪˈzɔːs|nguồn tài nguyên", "💡|alternative|ɔːlˈtɜːnətɪv|sự thay thế;🔌|appliance|əˈplaɪəns|thiết bị;🔋|battery|ˈbætəri|pin;🍂|compost|ˈkɒmpɒst|phân xanh;🍽️|consume|kənˈsjuːm|tiêu thụ;🛍️|disposable|dɪˈspəʊzəbl|dùng một lần;⚡|efficiency|ɪˈfɪʃnsi|sự hiệu quả;💨|emission|ɪˈmɪʃn|khí thải;👣|footprint|ˈfʊtprɪnt|dấu chân;🌡️|global warming|ˈɡləʊbl ˈwɔːmɪŋ|sự nóng lên toàn cầu;🏠|greenhouse|ˈɡriːnhaʊs|nhà kính;🗑️|landfill|ˈlændfɪl|bãi rác;🪵|material|məˈtɪəriəl|vật liệu;🌳|natural|ˈnætʃrəl|thuộc tự nhiên;📦|packaging|ˈpækɪdʒɪŋ|bao bì;🧴|plastic|ˈplæstɪk|nhựa;🪵|raw|rɔː|thô, chưa chế biến;🔄|switch|swɪtʃ|chuyển đổi;☣️|toxic|ˈtɒksɪk|độc hại;🚗|vehicle|ˈviːəkl|phương tiện", "💬|Adopting a green lifestyle helps reduce our carbon footprint.||Áp dụng lối sống xanh giúp giảm dấu chân carbon của chúng ta.;💬|We should use eco-friendly products instead of disposable plastics.||Chúng ta nên sử dụng các sản phẩm thân thiện với môi trường thay vì đồ nhựa dùng một lần.;💬|Renewable energy sources like solar power are sustainable.||Các nguồn năng lượng tái tạo như năng lượng mặt trời có tính bền vững.;💬|Recycling waste materials is a good way to protect the environment.||Tái chế rác thải là một cách tốt để bảo vệ môi trường.;💬|Everyone must be aware of the importance of wildlife conservation.||Mọi người p   ["Urbanisation", "Đô thị hóa", "🏙️", "🏙️|urbanisation|ˌɜːbənaɪˈzeɪʃn|đô thị hóa;🌆|city|ˈsɪti|thành phố;🚆|commuter|kəˈmjuːtə|người đi làm xa;🚗|congestion|kənˈdʒestʃən|sự tắc nghẽn;🏠|dweller|ˈdwelə|cư dân;🏫|facility|fəˈsɪləti|cơ sở vật chất;🛣️|infrastructure|ˈɪnfrəstrʌktʃə|cơ sở hạ tầng;🧑‍🤝‍🧑|inhabitant|ɪnˈhæbɪtənt|người dân cư trú;🚶|migrate|maɪˈɡreɪt|di cư;👨‍👩‍👧|overcrowding|ˌəʊvəˈkraʊdɪŋ|tình trạng quá tải;🧑‍🤝‍🧑|population|ˌpɒpjuˈleɪʃn|dân số;🌾|rural|ˈrʊərəl|thuộc nông thôn;🏚️|slum|slʌm|khu ổ chuột;🏡|suburb|ˈsʌbɜːb|vùng ngoại ô;🚦|traffic|ˈtræfɪk|giao thông;🏙️|urban|ˈɜːbən|thuộc đô thị;🚗|vehicle|ˈviːəkl|phương tiện;🏢|modern|ˈmɒdn|hiện đại;📈|development|dɪˈveləpmənt|sự phát triển;📏|standard|ˈstændəd|tiêu chuẩn", "🔑|access|ˈækses|sự tiếp cận;🚜|agricultural|ˌæɡrɪˈkʌltʃərəl|thuộc nông nghiệp;🧲|attract|əˈtrækt|thu hút;📍|central|ˈsentrəl|trung tâm;🌾|counter-urbanisation|ˈkaʊntər ˌɜːbənaɪˈzeɪʃn|phản đô thị hóa;📊|density|ˈdensəti|mật độ;📈|expand|ɪkˈspænd|mở rộng;🔮|forecast|ˈfɔːkɑːst|dự báo;🤝|guarantee|ˌɡærənˈtiː|đảm bảo;🧼|hygiene|ˈhaɪdʒiːn|vệ sinh;🏭|industrial|ɪnˈdʌstriəl|thuộc công nghiệp;🌊|influx|ˈɪnflʌks|sự đổ bộ, dòng người;🚫|lack|læk|sự thiếu hụt;🏙️|megacity|ˈmeɡəsɪti|siêu đô thị;⚖️|overload|ˌəʊvəˈləʊd|quá tải;📉|poverty|ˈpɒvəti|sự nghèo đói;💰|prosperous|ˈprɒspərəs|thịnh vượng;🔄|shift|ʃɪft|sự chuyển dịch;⚔️|tackle|ˈtækl|giải quyết;⬆️|upgrade|ˌʌpˈɡreɪd|nâng cấp", "💬|Urbanisation brings both economic development and social challenges.||Đô thị hóa mang lại cả sự phát triển kinh tế lẫn những thách thức xã hội.;💬|Traffic congestion is a major problem for daily commuters.||Tắc nghẽn giao thông là một vấn đề lớn đối với những người đi làm hàng ngày.;💬|Many rural inhabitants migrate to cities looking for better jobs.||Nhiều cư dân nông thôn di cư ra thành phố tìm kiếm công việc tốt hơn.;💬|The city needs to upgrade its infrastructure to handle the population influx.||Thành phố cần nâng cấp cơ sở hạ tầng để đối phó với làn sóng người đổ về.;💬|Overcrowding in megacities often leads to a lack of clean hygiene facilities.||Tình trạng quá tải ở các siêu đô thị thường dẫn đến sự thiếu hụt các cơ sở vệ sinh sạch sẽ.;💬|Counter-urbanisation happens when people move from cities to the countryside.||Phản đô thị hóa xảy ra khi người dân chuyển từ thành phố về vùng nông thôn."],

["Articles (a/an/the/zero)","a/an: danh từ đếm được số ít, chưa xác định (an trước âm nguyên âm). the: đã xác định, duy nhất, nhạc cụ, đại dương, the + adj chỉ nhóm người. Zero article: danh từ số nhiều/không đếm được nói chung.",["Viet Nam is ___ multicultural country with 54 ethnic groups.|a|an/the/some|multicultural bắt đầu bằng phụ âm /m/ → a.","She is ___ engineer from Japan.|an|a/the/some|engineer bắt đầu bằng nguyên âm → an.","He plays ___ guitar very well.|the|a/an/some|the + tên nhạc cụ.","___ Pacific Ocean is the largest ocean in the world.|The|A/An/This|the + tên đại dương.","___ elderly need more care and attention.|The|A/An/Some|the + adj chỉ một nhóm người.","R|Sửa lỗi sai về mạo từ: She is a honest student.|she is an honest student|honest có âm /ɒ/ (h câm) → an."]],
["Verbs with prepositions; which for a whole clause","Động từ + giới từ: rely on, depend on, suffer from, look for, participate in, apologise for. which thay cho cả mệnh đề phía trước, đứng sau dấu phẩy.",["We should rely ___ renewable energy.|on|in/at/for|rely on.","Many people suffer ___ pollution in big cities.|from|of/at/for|suffer from.","They are looking ___ ways to reduce plastic waste.|for|at/after/up|look for = tìm kiếm.","He didn't recycle bottles, ___ made the neighbours angry.|which|that/who/what|which thay cho cả mệnh đề trước, có dấu phẩy.","Everyone agreed to reduce waste, ___ is a good step toward green living.|which|that/who/whom|which thay cho cả mệnh đề trước.","R|Nối bằng 'which': The factory dumped waste into the river. This caused serious pollution.|the factory dumped waste into the river which caused serious pollution|which thay cho cả mệnh đề trước."]],
["Present perfect (review and extension)","have/has + V3: since/for, How long...?, the first time, ever/never, already/yet, recently/in recent years. Kết quả hoặc trải nghiệm liên quan đến hiện tại.",["The city ___ a lot since 2000.|has changed|changed/changes/is changing|since + mốc → hiện tại hoàn thành.","How long ___ in this apartment?|have you lived|did you live/do you live/are you living|How long + have you + V3.","Urbanisation ___ many problems in recent years.|has caused|caused/causes/had caused|in recent years → hiện tại hoàn thành.","This is the first time I ___ a skyscraper.|have visited|visited/visit/am visiting|The first time + hiện tại hoàn thành.","They ___ the new metro line yet.|haven't opened|didn't open/don't open/hasn't opened|yet → hiện tại hoàn thành phủ định.","R|Viết lại với hiện tại hoàn thành: She started living in Da Nang in 2018.|she has lived in da nang since 2018~she has been living in da nang since 2018|started + mốc → has + V3 + since."]],
["Simple, compound and complex sentences","Câu đơn: 1 mệnh đề. Câu ghép: 2 mệnh đề độc lập nối bằng for, and, nor, but, or, yet, so. Câu phức: mệnh đề chính + mệnh đề phụ (because, although, when, if...).",["Many people move to cities ___ they want better jobs.|because|but/or/so|because: chỉ lý do (câu phức).","I enjoy my job, ___ it is stressful sometimes.|but|so/because/or|but: tương phản (câu ghép).","___ the pay was low, she accepted the job.|Although|But/So/Or|Although + mệnh đề: câu phức.","He wants a better salary, ___ he is looking for a new job.|so|because/although/unless|so: chỉ kết quả (câu ghép).","You can work from home, ___ you can come to the office.|or|so/because/although|or: lựa chọn.","R|Nối bằng 'because': He was late. The bus broke down.|he was late because the bus broke down|because + lý do."]],

["Adverbial clauses of manner and result","Cách thức: as, as if/as though. Kết quả: so + adj/adv + that; such + (a/an) + adj + N + that.",["She did it exactly ___ the instructions said.|as|so/such/than|as + mệnh đề: theo cách.","He talks ___ he were a news reporter.|as if|as long as/unless/so that|as if: như thể.","The news was ___ shocking that everyone stopped talking.|so|such/too/very|so + adj + that.","It was ___ a boring programme that I turned off the TV.|such|so/too/very|such + a + adj + N + that.","She spoke so quietly ___ nobody could hear her.|that|which/as/than|so + adv + that.","R|Viết lại với 'so ... that': The programme was very interesting. We watched it twice.|the programme was so interesting that we watched it twice|so + adj + that."]],
["Adverbial clauses of condition and comparison","Điều kiện: if, unless (= if not), as long as, provided that. So sánh: as...as, than, the more..., the more...",["___ you study hard, you will pass the exam.|If|Unless/Although/Despite|If: điều kiện có thật.","You can't get the permit ___ you pay the fee.|unless|if/although/because|unless = if not.","He runs faster ___ his brother does.|than|as/so/like|so sánh hơn + than.","The more you read, ___ you learn.|the more|more/most/the most|So sánh kép: the more..., the more...","As long as the animals ___ protected, they will survive.|are|will be/were/be|as long as + hiện tại đơn.","R|Viết lại với 'unless': If you don't protect wildlife, many species will disappear.|unless you protect wildlife many species will disappear|if...not = unless."]],
["Three-word phrasal verbs","come up with (nghĩ ra), look forward to (mong đợi), put up with (chịu đựng), run out of (cạn kiệt), look up to (kính trọng), get on with, keep up with.",["We need to come ___ a good plan.|up with|out of/in for/down with|come up with = nghĩ ra.","I am looking ___ to starting my new job.|forward|up/after/for|look forward to + V-ing.","She has to put ___ with long working hours.|up|on/off/out|put up with = chịu đựng.","We have run ___ of paper.|out|up/off/down|run out of = cạn kiệt.","He looks ___ to his boss as a role model.|up|down/after/on|look up to = kính trọng.","R|Viết lại bằng 'put up with': She tolerates the noise.|she puts up with the noise|tolerate = put up with."]],
